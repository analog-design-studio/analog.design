<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>analog design studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Addresses on GitHub Pages are case-sensitive. This sends /lodge, /Lodge, /summed,
  // /WAY, /Hew and so on to the real folder. Add new project folders to the list.
  var folders = ['golfa', 'roam', 'way', 'hew', 'LODGE', 'Summed'];
  var parts = location.pathname.split('/'), first = parts[1] || '';
  for (var i = 0; i < folders.length; i++) {
    if (folders[i].toLowerCase() === first.toLowerCase() && folders[i] !== first) {
      location.replace('/' + folders[i] + '/' + location.hash);
    }
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Helvetica, "Helvetica Neue", Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; background: #fff; color: #000; }
  main { flex: 1; padding: 72px 48px 48px; }
  p { font-size: 21px; line-height: 1.5; }
  a { color: #000; }
  footer { padding: 0 48px 48px; }
  .wordmark { display: inline-block; }
  .wordmark img { display: block; height: clamp(64px, 8vw, 104px); width: auto; }
  @media (max-width: 640px) { main { padding: 40px 24px 32px; } footer { padding: 0 24px 32px; } }
</style>
</head>
<body>
<main>
  <p>Nothing at this address. <a href="/">Back to the studio</a>.</p>
</main>
<footer>
  <a class="wordmark" href="/" aria-label="analog design studio, home"><img src="/logo.svg" alt="analog design studio"></a>
</footer>
</body>
</html>
